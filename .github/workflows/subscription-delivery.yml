name: Subscription artifact and delivery checks
on:
  push:
    branches: [main]
    paths:
      - 'dist/gkd-fused.json5'
      - 'dist/gkd-fused.version.json'
      - 'dist/gkd-fused-manifest.json'
      - 'dist/gkd-fused-validation.json'
      - 'scripts/build-user-authorized-fusion.mjs'
      - 'scripts/check-subscription.mjs'
      - 'scripts/check-public-subscription.mjs'
      - '.github/workflows/subscription-delivery.yml'
  pull_request:
    paths:
      - 'dist/gkd-fused.json5'
      - 'dist/gkd-fused.version.json'
      - 'dist/gkd-fused-manifest.json'
      - 'dist/gkd-fused-validation.json'
      - 'scripts/build-user-authorized-fusion.mjs'
      - 'scripts/check-subscription.mjs'
      - 'scripts/check-public-subscription.mjs'
      - '.github/workflows/subscription-delivery.yml'
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * *'
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/check-subscription.mjs
      - name: Install isolated selector validator
        working-directory: tools/selector-validation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate published fusion selectors
        run: node tools/selector-validation/check-export.mjs --file dist/gkd-fused.json5 --out dist/gkd-fused-validation.json
      - name: Check public fusion Raw URL and version file (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/check-public-subscription.mjs
